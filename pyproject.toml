[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nimly-manager"
version = "0.2.1"
description = "Lokale støtteverktøy for Nimly Manager"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22,<3", "cryptography>=42,<46"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "cryptography>=42,<46"]

[project.scripts]
nimly-ble-probe = "nimly_ble_probe.cli:main"
nimly-ble-owner = "nimly_ble.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nimly_ble_probe", "src/nimly_ble"]

[tool.hatch.build.targets.wheel.force-include]
"custom_components/nimly_manager" = "custom_components/nimly_manager"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
