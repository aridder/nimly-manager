[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nimly-manager"
version = "0.1.0"
description = "Lokale støtteverktøy for Nimly Manager"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
nimly-ble-probe = "nimly_ble_probe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nimly_ble_probe"]

[tool.hatch.build.targets.wheel.force-include]
"custom_components/nimly_manager" = "custom_components/nimly_manager"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
